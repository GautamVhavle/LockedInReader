services:
  web:
    image: nginx:alpine
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATABASE_URL: ${DATABASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    profiles: ["sync"]
    environment:
      POSTGRES_PASSWORD: lockedin
      POSTGRES_DB: lockedin
    ports:
      - "5432:5432"
